[project]
name = "weibo-crawler"
version = "0.1.0"
description = "微博搜索爬虫 - 基于 Playwright"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40.0",
    "playwright-stealth>=1.0.0",
    "rich>=13.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "aiomysql>=0.2.0",
    "httpx>=0.27.0",
    "redis>=7.1.0",
    "curl-cffi>=0.7.0",
    "requests>=2.34.2",
]

[project.scripts]
weibo-crawler = "main:main"
